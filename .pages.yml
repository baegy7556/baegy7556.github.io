# Pages CMS 설정 파일 — https://app.pagescms.org 편집 화면이 이 파일을 읽어서 폼을 만듦.
# 사이트 내용은 이 파일이 아니라 src/data/*.yml, src/content/projects/*.md 에 있음.

media:
  input: public/media      # 업로드한 파일이 저장되는 폴더
  output: /media           # 사이트에서 쓰는 주소 (public/ 은 빠짐)
  rename: safe             # 파일 이름을 소문자-하이픈 형태로 정리 (공백·한글 때문에 링크 깨지는 것 방지)

content:
  # ───────────────────────── 프로젝트 ─────────────────────────
  - name: projects
    label: 프로젝트
    description: '프로젝트 하나 = 파일 하나. + 버튼으로 추가. 지우기 싫으면 ''숨기기'' 체크하면 사이트에서만 사라짐.'
    type: collection
    path: src/content/projects
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      primary: title
      fields: [title, featured, hidden, order]
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: 제목
        type: string
        required: true
        description: '카드와 상세 페이지 맨 위에 나옴. 새 프로젝트면 이게 파일 이름(=주소)이 됨.'
      - name: summary
        label: 한 줄 설명
        type: text
        required: true
        description: '카드에 보이는 설명. 담당자가 이것만 읽고도 뭔지 알게 1~2문장으로.'
      - name: featured
        label: 대표 프로젝트 (맨 앞에 고정)
        type: boolean
        description: '체크하면 목록 맨 앞에 ★ 표시와 함께 고정됨. 대표작은 2~3개만 추천.'
      - name: hidden
        label: 숨기기
        type: boolean
        description: '체크하면 사이트에서 안 보임. 파일은 그대로 남아서 나중에 다시 켤 수 있음.'
      - name: order
        label: 순서
        type: number
        description: '작은 숫자가 먼저 나옴 (1, 2, 3…). 대표 프로젝트끼리, 나머지끼리 각각 이 순서로 정렬됨. 사이에 끼우려면 15처럼 중간 숫자 쓰면 됨.'
        default: 100
      - name: cover
        label: 대표 이미지
        type: image
        description: '카드와 상세 페이지 위쪽 이미지. 가로 16:9 (예: 1200×675), 500KB 이하 추천. 비우면 이미지 없이 표시됨.'
        options:
          path: public/media/projects
      - name: coverAlt
        label: 대표 이미지 설명 (alt)
        type: string
        description: '화면을 못 보는 사람용 설명. 예) "The finished robot on the competition course"'
      - name: tags
        label: 사용 기술 태그
        type: string
        list: true
        description: '한 칸에 하나씩. 앞의 4개가 카드에 보임 → 제일 중요한 걸 위에.'
      - name: role
        label: 내 역할 (한 줄)
        type: string
        description: '예) "Electronics layout and Arduino code (team of 4)". 비우면 안 보임.'
      - name: period
        label: 기간
        type: string
        description: '예) "2026" 또는 "Mar 2026 – present". 비우면 안 보임.'
      - name: status
        label: 상태
        type: string
        description: '예) "Completed", "In development". 비우면 안 보임.'
      - name: links
        label: 링크 버튼
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.label}"
        description: 'GitHub 저장소, 데모, 게임 페이지 등. 없으면 비워두셈.'
        fields:
          - name: label
            label: 버튼 글자
            type: string
            required: true
            description: '예) "Source on GitHub", "Play on Roblox"'
          - name: url
            label: 주소
            type: string
            required: true
            description: 'https:// 로 시작하는 전체 주소'
      - name: media
        label: 미디어 (사진·영상)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.caption}"
        description: '상세 페이지 아래 ''Media'' 칸. 항목마다 파일 업로드 또는 유튜브 링크 중 하나만.'
        fields:
          - name: file
            label: 파일 (이미지 또는 영상)
            type: file
            description: 'jpg/png/webp/gif 또는 mp4/webm. 영상은 20MB 이하만 — 길면 유튜브 칸을 쓰셈.'
            options:
              path: public/media/projects
              extensions: [jpg, jpeg, png, webp, gif, svg, avif, mp4, webm]
          - name: youtube
            label: 유튜브 링크
            type: string
            description: '유튜브 주소 그대로 붙여넣기 (일부 공개도 됨). 이 칸을 채우면 파일 칸은 무시됨.'
          - name: caption
            label: 캡션
            type: string
            description: '사진·영상 아래 작은 글씨. 비우면 안 보임.'
          - name: alt
            label: 설명 (alt)
            type: string
            description: '화면을 못 보는 사람용 설명.'
      - name: body
        label: 본문
        type: rich-text
        description: 'Overview / My role / Process / Results 제목 아래에 쓰기. 필요 없는 제목은 지워도 됨. ''Tech used''는 태그에서 자동으로 나옴.'

  # ───────────────────────── 프로필 ─────────────────────────
  - name: profile
    label: 프로필
    description: '메인 맨 위 (이름, 소개, 이력서, 연락처). 비운 칸은 사이트에서 자동으로 숨겨짐.'
    type: file
    path: src/data/profile.yml
    format: yaml
    fields:
      - name: name
        label: 이름
        type: string
        required: true
      - name: headline
        label: 한 줄 소개 (작은 글씨)
        type: string
        description: '이름 위 작은 글씨. 예) "Mechatronics Engineering student at the University of Auckland"'
      - name: tagline
        label: 소개 문장
        type: text
        description: '이름 아래 큰 글씨. 뭘 할 줄 아는 사람인지 한 문장으로.'
      - name: facts
        label: 핵심 정보
        type: string
        list: true
        description: '소개 아래 ▸ 로 나오는 짧은 정보. 예) 학년, 거주지, 비자 상태'
      - name: cv
        label: 이력서 PDF
        type: file
        description: '새 PDF 올리면 바로 교체됨. 전화번호처럼 공개하기 싫은 정보는 빼고 올리셈. 비우면 다운로드 버튼이 사라짐.'
        options:
          extensions: [pdf]
      - name: email
        label: 이메일
        type: string
        description: '비우면 이메일 버튼이 사라짐.'
      - name: github
        label: GitHub 주소
        type: string
        description: '예) https://github.com/baegy7556 — 비우면 버튼이 사라짐.'
      - name: linkedin
        label: LinkedIn 주소
        type: string
        description: '예) https://www.linkedin.com/in/내아이디 — 비우면 버튼이 사라짐.'

  # ───────────────────────── 강점 ─────────────────────────
  - name: highlights
    label: 강점 (What I can do)
    description: '메인 두 번째 칸. 담당자가 30초 안에 보는 핵심. 3개가 적당.'
    type: file
    path: src/data/highlights.yml
    format: yaml
    fields:
      - name: items
        label: 강점 목록
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title}"
        fields:
          - name: title
            label: 제목
            type: string
            required: true
            description: '예) "Embedded control"'
          - name: body
            label: 설명
            type: text
            description: '구체적으로 뭘 할 줄 아는지 한두 문장.'
          - name: proof
            label: 근거 프로젝트
            type: string
            description: "→ 뒤에 나오는 글자. 예) Warman Challenge, VEX navigation"
          - name: hidden
            label: 숨기기
            type: boolean

  # ───────────────────────── 기술 스택 ─────────────────────────
  - name: skills
    label: 기술 스택
    description: '분류별로 묶어서 표시됨. 기술이 하나도 없는 분류는 자동으로 숨겨짐.'
    type: file
    path: src/data/skills.yml
    format: yaml
    fields:
      - name: groups
        label: 분류
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name}"
        fields:
          - name: name
            label: 분류 이름
            type: string
            required: true
            description: '예) "Programming"'
          - name: items
            label: 기술
            type: string
            list: true
            description: '한 칸에 하나씩.'

  # ───────────────────────── 경력 ─────────────────────────
  - name: experience
    label: 경력
    description: '위에 있는 항목이 사이트에서도 위에 나옴 (최신 순 추천). 항목을 드래그해서 순서 변경.'
    type: file
    path: src/data/experience.yml
    format: yaml
    fields:
      - name: items
        label: 경력 목록
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.role} — {fields.org}"
        fields:
          - name: role
            label: 직책
            type: string
            required: true
          - name: org
            label: 회사·단체
            type: string
          - name: location
            label: 장소
            type: string
            description: '비우면 안 보임.'
          - name: period
            label: 기간
            type: string
            description: '예) "2025 – Present"'
          - name: points
            label: 한 일
            type: string
            list: true
            description: '한 칸에 한 문장. 동사로 시작하면 깔끔함 (Tutored…, Organised…).'
          - name: hidden
            label: 숨기기
            type: boolean

  # ───────────────────────── 학력 ─────────────────────────
  - name: education
    label: 학력·수상
    description: '위에 있는 항목이 사이트에서도 위에 나옴.'
    type: file
    path: src/data/education.yml
    format: yaml
    fields:
      - name: items
        label: 학력 목록
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.degree}"
        fields:
          - name: degree
            label: 학위·과정
            type: string
            required: true
          - name: school
            label: 학교
            type: string
          - name: period
            label: 기간
            type: string
          - name: points
            label: 세부 내용
            type: string
            list: true
            description: '수강 과목, 수상, 동아리 등. 한 칸에 하나.'
          - name: hidden
            label: 숨기기
            type: boolean

  # ───────────────────────── 사이트 문구 ─────────────────────────
  - name: site
    label: 사이트 문구 (고급)
    description: '메뉴·버튼·섹션 제목 같은 고정 문구. 평소엔 건드릴 일 없음. 전부 필수.'
    type: file
    path: src/data/site.yml
    format: yaml
    fields:
      - name: seo
        label: 검색엔진·공유 미리보기
        type: object
        fields:
          - name: title
            label: 브라우저 탭 제목
            type: string
            required: true
          - name: description
            label: 검색 결과 설명
            type: text
            description: '구글 검색 결과·링크 미리보기에 나오는 설명. 150자 안쪽 추천. 비우면 프로필의 ''소개 문장''을 씀. (프로젝트 페이지는 각 프로젝트의 ''한 줄 설명''을 씀)'
          - name: image
            label: 공유 미리보기 이미지
            type: image
            description: '카톡·링크드인·슬랙 등에 링크 붙였을 때 뜨는 이미지. 1200×630 PNG 또는 JPG (SVG는 안 뜸). 프로젝트 페이지는 대표 이미지가 PNG/JPG/WebP면 그걸 쓰고, 아니면 이 이미지를 씀.'
            options:
              path: public/media
      - name: nav
        label: 상단 메뉴
        type: object
        fields:
          - { name: projects, label: 프로젝트, type: string, required: true }
          - { name: skills, label: 기술, type: string, required: true }
          - { name: experience, label: 경력, type: string, required: true }
          - { name: cv, label: 이력서, type: string, required: true }
      - name: buttons
        label: 버튼
        type: object
        fields:
          - { name: downloadCv, label: 이력서 다운로드, type: string, required: true }
          - { name: github, label: GitHub, type: string, required: true }
          - { name: linkedin, label: LinkedIn, type: string, required: true }
          - { name: email, label: 이메일, type: string, required: true }
      - name: sections
        label: 섹션 제목
        type: object
        fields:
          - { name: highlights, label: 강점, type: string, required: true }
          - { name: projects, label: 프로젝트, type: string, required: true }
          - { name: skills, label: 기술 스택, type: string, required: true }
          - { name: experience, label: 경력, type: string, required: true }
          - { name: education, label: 학력, type: string, required: true }
      - name: project
        label: 프로젝트 상세 페이지
        type: object
        fields:
          - { name: back, label: 목록으로 돌아가기, type: string, required: true }
          - { name: role, label: 역할, type: string, required: true }
          - { name: period, label: 기간, type: string, required: true }
          - { name: status, label: 상태, type: string, required: true }
          - { name: tech, label: 사용 기술, type: string, required: true }
          - { name: links, label: 링크, type: string, required: true }
          - { name: media, label: 미디어, type: string, required: true }
          - { name: featured, label: 대표 프로젝트 표시, type: string, required: true }
      - name: notFound
        label: 404 페이지
        type: object
        fields:
          - { name: title, label: 제목, type: string, required: true }
          - { name: link, label: 홈으로 링크, type: string, required: true }
      - name: a11y
        label: 접근성 (화면낭독기용)
        type: object
        fields:
          - { name: skipLink, label: 본문 바로가기, type: string, required: true }
          - { name: themeToggle, label: 다크모드 버튼, type: string, required: true }
          - { name: techList, label: 기술 태그 목록, type: string, required: true }
