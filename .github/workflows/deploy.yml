name: Deploy to GitHub Pages

# Runs on every push to main (including saves from Pages CMS).
# Safety: "deploy" only runs if "build" succeeds. If the build fails
# (e.g. a required field is empty), nothing is deployed and the live site
# stays exactly as it was. The error message is in the failed "build" job.
on:
  push:
    branches: [main]
  pull_request:          # PRs: build only, as a check — never deployed
  workflow_dispatch:     # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build (fails with the file + field name if content is invalid)
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
